name: CI

# Manual trigger only: these builds are Mathlib-scale, so they run on request.
on:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The pinned commit of anthropics/formal-math is not reachable from a
      # branch tip, so Lake cannot check it out by itself; fetch it by hash
      # (the same steps as bootstrap.sh, without its build).
      - name: Fetch the pinned percolation dependency
        shell: bash
        run: |
          DIR=.lake/packages/PercolationContinuity
          REV=795efb86f191735c5481675763537cfb4ff37e55
          mkdir -p .lake/packages
          lake update PercolationContinuity >/dev/null 2>&1 || true
          [ -d "$DIR/.git" ] || git clone -q https://github.com/anthropics/formal-math "$DIR"
          git -C "$DIR" fetch -q origin "$REV"
          git -C "$DIR" checkout -q "$REV"

      - name: Get the Mathlib cache
        run: lake exe cache get

      - name: Enforce warning-free production build
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee production-build.log
          if grep -iE '^warning:|declaration uses .sorry' production-build.log; then
            echo "Production build emitted a warning."
            exit 1
          fi

      # Build the axiom audit and surface its `#print axioms` output in the log,
      # confirming the main theorems use only the standard Mathlib axioms.
      - name: Axiom audit
        shell: bash
        run: |
          set -o pipefail
          lake build Rotor.Meta.AxiomsAudit 2>&1 | tee axioms-audit.log
          if grep -iE '^warning:|declaration uses .sorry' axioms-audit.log; then
            echo "Axiom audit build emitted a warning."
            exit 1
          fi

      - name: Frozen statements match their hashes
        run: |
          pip install pyyaml
          python3 tools/check_manifest.py
