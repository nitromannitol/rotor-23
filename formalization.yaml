version: "v0.4"

project:
  name: "rotor-23"
  description: >-
    A Lean 4 formalization of "Eulerian walkers on Z^2 have range exponent 2/3"
    (Bou-Rabee and Peres): the clockwise rotor walk with independent uniform
    initial rotors on the square lattice and on doubly periodic plane graphs of
    maximum degree three is almost surely recurrent, its rescaled circuit
    ranges converge to a deterministic compact convex limit shape, and its
    range grows like t^(2/3) (Theorem 1.1).  The same conclusions hold for
    independent rotor laws close to uniform in total variation (Proposition
    1.2), and a doubly periodic plane graph, the square lattice with many
    leaves attached to every vertex, carries a transient rotor walk
    (Proposition 1.3).  Every theorem, lemma and proposition of the paper is
    formalized; the cited Liggett-Schonmann-Stacey domination theorem is
    proved and used in the unconditional results. Mathlib-only comparator
    pairs are provided under RotorAudit/.
  authors:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

sources:
  - title: "Eulerian walkers on Z^2 have range exponent 2/3"
    authors:
      - "Ahmed Bou-Rabee"
      - "Yuval Peres"
    id: "arXiv:2608.23545"
    url: "https://arxiv.org/abs/2608.23545"
    type: "manuscript"
    relationship: "formalizes"
    note: >-
      The paper under formalization.  Every theorem, lemma and proposition of
      the paper is formalized; see status.scope for cited inputs and
      fidelity.divergences for the places where
      a Lean statement is not literally the paper's.
    license: "arXiv non-exclusive distribution license 1.0"
    author_endorsement: "n/a"   # the formalizer is an author of the source

related_formalizations:
  - id: "https://github.com/nitromannitol/Lattice-Probability"
    relationship: "builds-on"
    note: >-
      The shared library Lattice-Probability (pinned git dependency at commit
      d36783565c4de41cce5cf079ddd5ace3efe6a8ff).  It supplies Kingman's
      subadditive ergodic theorem (LatticeProb.Prob.Kingman).

status:
  scope: >-
    A Lean 4 / Mathlib formalization of every theorem, lemma and proposition of
    the paper: recurrence, the limit shape of the circuit ranges and the range
    exponent 2/3 of the rotor walk with independent uniform initial rotors on
    the square lattice with the clockwise mechanism and on doubly periodic
    plane graphs of maximum degree three (Theorem 1.1), the extension to
    independent rotor laws close to uniform in total variation (Proposition
    1.2), the transient pendant graph G_M (Proposition 1.3), and the lemmas and
    propositions of Sections 2 to 6. The cited inputs, including LSS domination,
    are proved. The older main statements retain an explicit LSS hypothesis;
    Rotor/MainTheoremsUnconditional.lean applies its proof. The open questions,
    figures, simulations and survey are not formalized. Mathlib-only comparator
    pairs are provided for the unconditional statements.
  sorry_count: 0
  sorry_count_scope: "Rotor production library only"
  comparator_challenge_sorry_count: 10
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
  - declaration: Rotor.main_square_unconditional
    file: Rotor/MainTheoremsUnconditional.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    comparator_config: RotorAudit/MainSquareUnconditional/comparator.json
    literature_dependencies:
    - statement: Liggett-Schonmann-Stacey domination, proved as Rotor.External.lss_holds
      source: Liggett, Schonmann and Stacey, Domination by product measures (1997), Theorem 0.0(ii)
  - declaration: Rotor.main_degree_three_unconditional
    file: Rotor/MainTheoremsUnconditional.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    comparator_config: RotorAudit/MainDegreeThreeUnconditional/comparator.json
    literature_dependencies:
    - statement: Liggett-Schonmann-Stacey domination, proved as Rotor.External.lss_holds
      source: Liggett, Schonmann and Stacey, Domination by product measures (1997), Theorem 0.0(ii)
  - declaration: Rotor.perturbations_square_unconditional
    file: Rotor/MainTheoremsUnconditional.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    comparator_config: RotorAudit/PerturbationsSquareUnconditional/comparator.json
    literature_dependencies:
