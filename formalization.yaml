version: "v0.3"

project:
  name: "rotor-23"
  authors:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

sources:
  - title: "Eulerian walkers on Z^2 have range exponent 2/3"
    authors:
      - "Ahmed Bou-Rabee"
      - "Yuval Peres"
    id: "arXiv:2608.23545"
    url: "https://arxiv.org/abs/2608.23545"
    type: "manuscript"
    license: ""                 # TODO(author): the license under which the paper is posted
    author_contacted: "n/a"     # the formalizer is an author of the source
    prior_work: ""

status:
  scope: >-
    A Lean 4 / Mathlib formalization of every theorem, lemma and proposition of
    the paper: recurrence, the limit shape of the circuit ranges and the range
    exponent 2/3 of the rotor walk with independent uniform initial rotors on
    the square lattice with the clockwise mechanism and on doubly periodic
    plane graphs of maximum degree three (Theorem 1.1), the extension to
    independent rotor laws close to uniform in total variation (Proposition
    1.2), the transient pendant graph G_M (Proposition 1.3), and the lemmas and
    propositions of Sections 2 to 6.  SCOPE BOUNDARY: seven results the paper
    cites from the literature are stated as propositions in Rotor/External/.
    One of them, subcritical exponential decay for Bernoulli bond percolation
    on Z^2, is proved in Rotor/Bridge/ from the percolation library
    PercolationContinuity (anthropics/formal-math); the other six (the abelian
    property, Florescu-Levine-Peres, Holroyd-Propp, Angel-Holroyd, Kingman's
    subadditive ergodic theorem, Liggett-Schonmann-Stacey domination) are not
    proved here and are explicit hypotheses of every theorem whose proof uses
    them; ASSUMPTIONS.md lists them with their Lean statements.  Not
    formalized: the open questions of Section 7, the figures, the simulations
    and the survey of related work.  The main theorems are stated in full in
    Rotor/MainTheorems.lean; all five are additionally restated over a
    Mathlib-only vocabulary for the Lean comparator (Audit/).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Rotor.main_square"
      file: "Rotor/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/MainSquare/comparator.json"
      literature_dependencies:
        - "Florescu-Levine-Peres 2016, Lemmas 2.1 and 2.4 (Rotor.External.OneCircuit), hypothesis"
        - "Holroyd-Levine-Meszaros-Peres-Propp-Wilson 2008, Lemma 3.9 (Rotor.External.Abelian), hypothesis"
        - "Holroyd-Propp 2010, Lemma 6 (Rotor.External.VisitsAllOfVisitsOne), hypothesis"
        - "Kingman 1968, Theorems 3 and 5 (Rotor.External.Kingman), hypothesis"
        - "Liggett-Schonmann-Stacey 1997, Theorem 0.0(ii) (Rotor.External.LSS), hypothesis"
    - declaration: "Rotor.main_degree_three"
      file: "Rotor/MainTheorems.lean"
      sorry_count: 0
