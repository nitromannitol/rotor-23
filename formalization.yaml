version: "v0.4"

project:
  name: "rotor-23"
  description: >-
    A Lean 4 formalization of "Eulerian walkers on Z^2 have range exponent 2/3"
    (Bou-Rabee and Peres): the clockwise rotor walk with independent uniform
    initial rotors on the square lattice and on doubly periodic plane graphs of
    maximum degree three is almost surely recurrent, its rescaled circuit
    ranges converge to a deterministic compact convex limit shape, and its
    range grows like t^(2/3) (Theorem 1.1).  The same conclusions hold for
    independent rotor laws close to uniform in total variation (Proposition
    1.2), and a doubly periodic plane graph, the square lattice with many
    leaves attached to every vertex, carries a transient rotor walk
    (Proposition 1.3).  Every theorem, lemma and proposition of the paper is
    formalized; the Liggett-Schonmann-Stacey domination theorem, which the
    paper cites without proof, is an explicit hypothesis of the theorems that
    use it, and the five main theorems are independently checked by the
    comparator pairs under RotorAudit/.
  authors:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

sources:
  - title: "Eulerian walkers on Z^2 have range exponent 2/3"
    authors:
      - "Ahmed Bou-Rabee"
      - "Yuval Peres"
    id: "arXiv:2608.23545"
    url: "https://arxiv.org/abs/2608.23545"
    type: "manuscript"
    relationship: "formalizes"
    note: >-
      The paper under formalization.  Every theorem, lemma and proposition of
      the paper is formalized; see status.scope for the one cited result that
      is carried as a hypothesis and fidelity.divergences for the places where
      a Lean statement is not literally the paper's.
    license: ""                 # TODO(author): the license under which the paper is posted
    author_endorsement: "n/a"   # the formalizer is an author of the source

related_formalizations:
  - id: "https://github.com/anthropics/formal-math"
    relationship: "builds-on"
    note: >-
      The percolation library PercolationContinuity (subdirectory percolation,
      pinned git dependency at commit 795efb86f191735c5481675763537cfb4ff37e55),
      a separate formalization by Justin Leder, produced with Claude agents.
      It supplies Kesten's p_c(Z^2) = 1/2 and the sharpness of the phase
      transition, from which subcritical exponential decay is proved here.
  - id: "https://github.com/nitromannitol/Lattice-Probability"
    relationship: "builds-on"
    note: >-
      The shared library Lattice-Probability (pinned git dependency at commit
      9d44b4d4670df393bb86ac5a4e042f215001cddf).  It supplies Kingman's
      subadditive ergodic theorem (LatticeProb.Prob.Kingman).

status:
  scope: >-
    A Lean 4 / Mathlib formalization of every theorem, lemma and proposition of
    the paper: recurrence, the limit shape of the circuit ranges and the range
    exponent 2/3 of the rotor walk with independent uniform initial rotors on
    the square lattice with the clockwise mechanism and on doubly periodic
    plane graphs of maximum degree three (Theorem 1.1), the extension to
    independent rotor laws close to uniform in total variation (Proposition
    1.2), the transient pendant graph G_M (Proposition 1.3), and the lemmas and
    propositions of Sections 2 to 6.  SCOPE BOUNDARY: seven results the paper
    cites from the literature are stated as propositions in Rotor/External/.
    Six of them are proved in Rotor/Bridge/: subcritical exponential decay
    for Bernoulli bond percolation on Z^2, from the percolation library
    PercolationContinuity (anthropics/formal-math), Kingman's subadditive
    ergodic theorem, from the shared library Lattice-Probability
    (LatticeProb.Prob.Kingman), the abelian property of rotor-routing
    (HLMPPW Lemma 3.9), by induction on legal routings, the one-circuit
    property of a rotor walk (Florescu-Levine-Peres, Lemmas 2.1 and 2.4), by
    an injectivity argument on traversed edges together with incoming/outgoing
    degree counts at circuit times, Holroyd-Propp's Lemma 6 (a rotor walk
    that visits one vertex infinitely often visits every vertex infinitely
    often), by propagating infinitely-many-visits along a walk between any
    two vertices, and Angel-Holroyd's theorem that recurrence does not depend
    on the starting vertex, by the same propagation combined with the abelian
    property.  The seventh, Liggett-Schonmann-Stacey domination, is not
    proved here and is an explicit hypothesis of every theorem whose proof
    uses it; ASSUMPTIONS.md lists it with its Lean statement.  Not
    formalized: the open questions of Section 7, the figures, the simulations
    and the survey of related work.  The main theorems are stated in full in
    Rotor/MainTheorems.lean; all five are additionally restated over a
    Mathlib-only vocabulary for the Lean comparator (RotorAudit/).
  sorry_count: 0
  sorry_count_scope: "Rotor production library only"
  comparator_challenge_sorry_count: 5
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Rotor.main_square"
      file: "Rotor/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "RotorAudit/MainSquare/comparator.json"
      literature_dependencies:
        - statement: "Liggett-Schonmann-Stacey domination (Rotor.External.LSS), an explicit hypothesis"
          source: "Liggett, Schonmann and Stacey, Domination by product measures (1997), Theorem 0.0(ii)"
    - declaration: "Rotor.main_degree_three"
      file: "Rotor/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "RotorAudit/MainDegreeThree/comparator.json"
      literature_dependencies:
        - statement: "Liggett-Schonmann-Stacey domination (Rotor.External.LSS), an explicit hypothesis"
          source: "Liggett, Schonmann and Stacey, Domination by product measures (1997), Theorem 0.0(ii)"
    - declaration: "Rotor.perturbations_square"
      file: "Rotor/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "RotorAudit/PerturbationsSquare/comparator.json"
      literature_dependencies:
        - statement: "Liggett-Schonmann-Stacey domination (Rotor.External.LSS), an explicit hypothesis"
          source: "Liggett, Schonmann and Stacey, Domination by product measures (1997), Theorem 0.0(ii)"
    - declaration: "Rotor.perturbations_degree_three"
      file: "Rotor/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "RotorAudit/PerturbationsDegreeThree/comparator.json"
      literature_dependencies:
        - statement: "Liggett-Schonmann-Stacey domination (Rotor.External.LSS), an explicit hypothesis"
          source: "Liggett, Schonmann and Stacey, Domination by product measures (1997), Theorem 0.0(ii)"
    - declaration: "Rotor.pendant_counterexample"
      file: "Rotor/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "RotorAudit/PendantCounterexample/comparator.json"
      literature_dependencies: []
    - declaration: "RotorAudit.main_square"
      file: "RotorAudit/MainSquare/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "RotorAudit/MainSquare/comparator.json"
      literature_dependencies:
