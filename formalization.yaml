automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5.5"
        - "Claude Sonnet 5"
        - "Claude Opus 5"
        - "DeepSeek v4.1 Flash"
      framework: >-
        Claude Code (Anthropic) and the Pi agent harness, directing the models above; the author
        supervised the work and is responsible for the formalization.
      tool_setup: >-
        Lake builds under the pinned Lean toolchain and Mathlib revision. Every change is gated by
        the axiom-closure and warning-free-build checks, and the public CI runs the Mathlib-only
        comparator challenge/solution pairs against leanprover/comparator, lean4export and landrun
        at the revisions recorded in .github/workflows/.
      cost:
        spend_usd: "not separately tracked (subscription and API accounts)"
        hardware: "one Ubuntu workstation"
      prompting_notes: >-
        Human-directed agent work, closely supervised by the author. Statement differences from the
        paper are disclosed under fidelity.
fidelity:
  divergences: >-
    Where a Lean statement is not literally the paper's, CORRESPONDENCE.md
    records it: a routing is its initial state and its list of actuated
    vertices rather than a sequence of states; prop:passage is conjoined with
    T(n) < infinity; prop:live-recurrence asserts recurrence for the fixed
    start.  Rendering conventions (not divergences): T(n) takes values in the
    extended naturals and A_n is read only where T(n) is finite; B, kappa and
    the volume constant are bound before the almost-sure quantifier;
    conclusion (ii) of Theorem 1.1 is stated both as Hausdorff limits and as
    inner and outer bounds on A_n; coordinates are centered at the start
    vertex; Proposition 1.3 carries the explicit threshold M >= 50331645; on
    the square lattice, Proposition 1.2 takes invariance of the marginals under
    any finite-index translation subgroup.  The one cited result that is not
    proved enters as a hypothesis whose Lean statement is in ASSUMPTIONS.md;
    that it renders the cited theorem faithfully is a reading, not a check.

review:
  status: "author-verified"
  reviewers:
    - "Ahmed Bou-Rabee"
  notes: >-
    Correctness of every proof is guaranteed by the Lean kernel and Mathlib (no
    sorry, no custom axiom).  The author ruled on the statement-level
    decisions.  The statements were additionally audited by GLM-5.3 auditors
    and by an independent comparator-style audit run by gpt-6-astra.  This is
    not external peer review.

alignment:
  namespace: "Rotor"
  statements:
    - source: "Theorem 1.1 (thm:main), the square lattice"
      lean: "Rotor.main_square"
      module: "Rotor.MainTheorems"
      status: "proved"
      note: "Certified statement Rotor.Frozen.main_square; hypothesis Rotor.External.LSS. Comparator challenge RotorAudit/MainSquare/."
    - source: "Theorem 1.1 (thm:main), doubly periodic graphs of maximum degree three"
      lean: "Rotor.main_degree_three"
      module: "Rotor.MainTheorems"
      status: "proved"
      note: "Certified statement Rotor.Frozen.main_degree_three; hypothesis Rotor.External.LSS. Comparator challenge RotorAudit/MainDegreeThree/."
    - source: "Proposition 1.2 (prop:small-perturbations), the square lattice"
      lean: "Rotor.perturbations_square"
      module: "Rotor.MainTheorems"
      status: "proved"
      note: "Certified statement Rotor.Frozen.perturbations_square; hypothesis Rotor.External.LSS. Comparator challenge RotorAudit/PerturbationsSquare/."
    - source: "Proposition 1.2 (prop:small-perturbations), doubly periodic graphs of maximum degree three"
      lean: "Rotor.perturbations_degree_three"
      module: "Rotor.MainTheorems"
      status: "proved"
      note: "Certified statement Rotor.Frozen.perturbations_degree_three; hypothesis Rotor.External.LSS. Comparator challenge RotorAudit/PerturbationsDegreeThree/."
    - source: "Proposition 1.3 (prop:pendant-counterexample)"
      lean: "Rotor.pendant_counterexample"
      module: "Rotor.MainTheorems"
      status: "proved"
      note: "Certified statement Rotor.Frozen.pendant_counterexample; no hypothesis. Comparator challenge RotorAudit/PendantCounterexample/."
    - source: "Sections 2 to 6: every lemma and proposition"
      lean: "Rotor.Frozen.*"
      module: "Rotor.Frozen"
      status: "proved"
      note: "One registered statement per paper statement; the full map is CORRESPONDENCE.md."
    - source: "Cited result: Liggett-Schonmann-Stacey domination, Theorem 0.0(ii)"
      lean: "Rotor.External.LSS"
      module: "Rotor.External.LSS"
      status: "literature-dependency"
      note: "Explicit hypothesis of the theorems that use it; listed in ASSUMPTIONS.md."
    - source: "Cited result: subcritical exponential decay for Bernoulli bond percolation on Z^2"
      lean: "Rotor.Bridge.subcriticalDecay_holds"
      module: "Rotor.Bridge.SubcriticalDecay"
      status: "proved"
      note: "Proved from the percolation library PercolationContinuity."
    - source: "Cited result: Kingman's subadditive ergodic theorem"
      lean: "Rotor.Bridge.kingman_holds"
      module: "Rotor.Bridge.Kingman"
      status: "proved"
      note: "Proved from the shared library Lattice-Probability (LatticeProb.Prob.Kingman)."
    - source: "Cited result: the abelian property of rotor-routing (HLMPPW Lemma 3.9)"
      lean: "Rotor.Bridge.abelian_holds"
      module: "Rotor.Bridge.Abelian"
      status: "proved"
      note: "Proved by induction on legal routings (the diamond-lemma argument)."
    - source: "Cited result: the one-circuit property of a rotor walk (Florescu-Levine-Peres, Lemmas 2.1 and 2.4)"
      lean: "Rotor.Bridge.oneCircuit_holds"
      module: "Rotor.Bridge.OneCircuit"
      status: "proved"
      note: "Proved by an injectivity argument on traversed edges together with incoming/outgoing degree counts at circuit times."
    - source: "Cited result: Holroyd-Propp Lemma 6 (a rotor walk that visits one vertex infinitely often visits every vertex infinitely often)"
      lean: "Rotor.Bridge.visitsAllOfVisitsOne_holds"
      module: "Rotor.Bridge.HolroydPropp"
      status: "proved"
      note: "Proved by propagating infinitely-many-visits along a walk between any two vertices of the (preconnected) graph."
    - source: "Cited result: Angel-Holroyd 2012, Theorem 1 (recurrence does not depend on the starting vertex)"
      lean: "Rotor.Bridge.recurrentOfRecurrent_holds"
      module: "Rotor.Bridge.AngelHolroyd"
      status: "proved"
      note: "Proved by propagating recurrence along adjacency and then along a connecting walk, via Rotor.Bridge.abelian_holds."

acknowledgements: >-
  The paper is joint work with Yuval Peres.  Built on Lean 4, Mathlib, Lake,
  the percolation library PercolationContinuity of anthropics/formal-math, the
  shared library Lattice-Probability, and leanprover/comparator.
