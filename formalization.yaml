          source: "Liggett, Schonmann and Stacey, Domination by product measures (1997), Theorem 0.0(ii)"
    - declaration: "RotorAudit.perturbations_degree_three"
      file: "RotorAudit/PerturbationsDegreeThree/Solution.lean"
