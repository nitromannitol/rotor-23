      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/PerturbationsSquare/comparator.json"
      literature_dependencies:
        - "Florescu-Levine-Peres 2016, Lemmas 2.1 and 2.4 (Rotor.External.OneCircuit), hypothesis"
        - "Holroyd-Levine-Meszaros-Peres-Propp-Wilson 2008, Lemma 3.9 (Rotor.External.Abelian), hypothesis"
        - "Holroyd-Propp 2010, Lemma 6 (Rotor.External.VisitsAllOfVisitsOne), hypothesis"
        - "Kingman 1968, Theorems 3 and 5 (Rotor.External.Kingman), hypothesis"
        - "Liggett-Schonmann-Stacey 1997, Theorem 0.0(ii) (Rotor.External.LSS), hypothesis"
    - declaration: "Rotor.perturbations_degree_three"
